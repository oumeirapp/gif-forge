[package]
name = "gifski-worker"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"
publish = false

[dependencies]
gif = { version = "=0.13.1", default-features = false, features = ["std", "raii_no_panic"] }
gif-dispose = "=5.0.1"
gifski = { version = "=1.34.0", default-features = false, features = ["gifsicle"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

